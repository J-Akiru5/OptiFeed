; Bench-only indicator test. Deliberately separate from firmware/platformio.ini
; so it can be flashed without touching the production firmware or its envs.
;
;   pio run -d firmware/bench/led-bench-test -t upload
;   pio device monitor -d firmware/bench/led-bench-test
;
; BENCH_RELAY_PIN matches the unit under test:
;   5  -> CICT Building A unit (esp32dev-relay5 build)   [default]
;   25 -> reference wiring (default production env)
;
; Platform is pinned to the same release the production firmware builds on.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -DBENCH_RELAY_PIN=5

; Reference wiring (relay on GPIO 25) instead of the CICT unit.
[env:esp32dev-relay25]
extends = env:esp32dev
build_flags = -std=gnu++17 -DBENCH_RELAY_PIN=25

