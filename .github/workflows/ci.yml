name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check API route auth
        run: |
          # All API route files must either:
          # 1. Import from lib/auth/session or lib/auth/with-auth (session auth)
          # 2. Be in the allowlist (device token-authed routes, no session needed)
          ALLOWLIST="api/ingest|api/feed-command|api/schedule-sync|api/health"

          FAIL=0
          for f in $(find apps/web/app/api -name 'route.ts' -o -name 'route.tsx' | grep -v node_modules); do
            # Skip allowlisted routes
            if echo "$f" | grep -qE "($ALLOWLIST)"; then
              continue
            fi
            # Check for auth import
            if ! grep -qE "from ['\"]@/lib/auth/(session|with-auth)['\"]" "$f"; then
              echo "::error file=$f::Missing auth import. API routes must import from @/lib/auth/session or @/lib/auth/with-auth."
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All API routes have auth imports."

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
