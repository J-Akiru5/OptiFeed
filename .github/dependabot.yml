version: 2

# Automated dependency updates. No auto-merge: every pull request here is
# reviewed and merged by a human, and `main` is never a Dependabot target.
#
# Groups only cover minor and patch updates of the same channel. Major updates
# stay as individual pull requests so each one is read on its own — the
# repository does not take broad major upgrades (see CONTRIBUTING.md).
#
# Security advisories are handled by GitHub's Dependabot security updates, not
# by this schedule; `pnpm audit` runs weekly in .github/workflows/security.yml.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    # CI runs Node 22 and the package supports >=22.5. Types must track the
    # runtime: a future major lets code typecheck against APIs Node 22 does not
    # have. Remove this once CI moves (then pin the matching major).
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Held until the coordinated upgrades in #538 land. Remove each entry in
      # the PR that lands that upgrade.
      - dependency-name: "prisma"
        versions: [">=7"]
      - dependency-name: "@prisma/client"
        versions: [">=7"]
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
    # Smaller groups: the 14-package production group regressed first-load JS
    # by up to 20.7 kB (#510). Each group gets its own measured PR.
    groups:
      production-supabase:
        dependency-type: "production"
        patterns:
          - "@supabase/*"
        update-types:
          - "minor"
          - "patch"
      production-framework:
        dependency-type: "production"
        patterns:
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
          - "motion"
          - "lucide-react"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      production-utilities:
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "@supabase/*"
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
          - "motion"
          - "lucide-react"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
