[platformio]
src_dir = firmware-main
default_envs = esp32dev

[env:esp32dev]
; Pinned for reproducibility, matching the validated core on the
; energy-monitoring project. Do not float this to "espressif32" latest.
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17

; Two 1.875 MB app slots instead of the default two 1.25 MB slots, so a full
; signed image always fits. The table also keeps NVS at 0x9000, so
; pio run -t upload keeps the stored WiFi credentials and device identity.
; A partition table can never be changed over the air: this is the one USB
; bootstrap flash (docs/firmware-ota-plan.md §3.1 and §6, decision OTA-1).
board_build.partitions = min_spiffs.csv

; Libraries are resolved by PlatformIO; no Arduino Library Manager step.
lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit BusIO@^1.17.4
    bblanchon/ArduinoJson@^7.4.3
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6

; Bench-only build with LAN ArduinoOTA enabled (decision OTA-7). Field builds
; use [env:esp32dev] above, where the LAN updater is compiled out entirely.
; pio run -d firmware -e esp32dev-lan
[env:esp32dev-lan]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DENABLE_LAN_OTA

; Field unit wired with the relay signal on GPIO 5 instead of 25 (CICT Building A
; feeder, found on the bench 2026-10-28). Same firmware, only the pin differs.
; pio run -d firmware -e esp32dev-relay5 -t upload
[env:esp32dev-relay5]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DRELAY_PIN=5
