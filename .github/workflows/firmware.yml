name: Firmware

# Compiles the ESP32 sketch with PlatformIO, the same toolchain used on the
# energy-monitoring project. Validation only — never flashes or deploys.

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile
        run: pio run -d firmware
