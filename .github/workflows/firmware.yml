name: Firmware

# Runs the host native test suite and compiles the ESP32 sketch with PlatformIO,
# the same toolchain used on the energy-monitoring project. Validation only —
# never flashes or deploys.

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # Host-only: builds firmware/test against Unity and the local compiler.
      # No board, no network, no secrets. Runs before the ESP32 compile so a
      # broken safety/config test fails fast.
      - name: Native tests (safety + config)
        run: pio test -d firmware -e native

      - name: Compile
        run: pio run -d firmware
