name: CI

# Validation only.
#
# This workflow never deploys an application and never touches a real
# database. The `quality` job runs against dummy credentials and invokes the
# Next.js production build directly (`next build`) instead of `pnpm build`,
# because the package build script runs `prisma migrate deploy`.
#
# The `e2e` job starts a DISPOSABLE local Supabase stack (Postgres + Auth +
# storage via `supabase start`) on the runner. That stack is the only database
# it touches: no production or staging credentials exist in this workflow, and
# every connection value is read from the local stack's own `supabase status`.
# See docs/e2e.md.
#
# Green-tree marker (2026-11-02, owner-approved). A tree that already passed
# this gate on the default branch (`staging`) is not re-tested on a promotion
# to `main`. The marker is saved only by a successful push to `staging`; a
# cache miss, eviction or API error falls back to a full run. Step-level skips
# keep the required check name `quality` stable. Measured 2026-11-02:
# quality 363s, e2e 604s (run 41374968165).
# Application deployment is handled exclusively by the Vercel Git integration
# for the two approved branches (`staging` and `main`). See
# docs/deployment-workflow.md.

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. Pull-request runs are superseded by newer pushes;
  # integration and deployment branches always finish so their result is a
  # reliable gate.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # 20 -> 30 minutes: the unit step now runs with v8 coverage AND enforces the
    # lib/ thresholds, which is the slowest part of the job.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci_dummy
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci_dummy
      NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the tree hash
        id: tree
        shell: bash
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Restore the green-tree marker
        id: green
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .ci-green
          key: ci-green-${{ steps.tree.outputs.tree }}
          lookup-only: true

      - name: Report the skip decision
        run: |
          if [ "${{ steps.green.outputs.cache-hit }}" = "true" ]; then
            echo "Tree ${{ steps.tree.outputs.tree }} already passed this gate; heavy steps skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tree ${{ steps.tree.outputs.tree }} has no green marker; full run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install pnpm
        if: steps.green.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm --filter web prisma:generate

      - name: Validate Prisma schema
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm --filter web exec prisma validate

      - name: Lint
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm typecheck

      - name: Unit tests + lib coverage (threshold enforced)
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm --filter web test:coverage

      # Report-only (#457): prints Tagalog review progress to the job log.
      # The script always exits 0; translation parity is enforced by tests,
      # not by this progress number.
      - name: Tagalog coverage report
        if: always() && steps.green.outputs.cache-hit != 'true'
        run: pnpm --filter web i18n:tl-coverage

      - name: Upload coverage summary
        if: always() && steps.green.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: apps/web/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: API checks (regulation conformance + route auth)
        if: steps.green.outputs.cache-hit != 'true'
        run: pnpm api:check

      # next build directly (not pnpm build) so CI never runs
      # `prisma migrate deploy` — dummy DB env, zero production access.
      - name: Build
        if: steps.green.outputs.cache-hit != 'true'
        run: npx next build
        working-directory: apps/web

      - name: Create the green-tree marker
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && steps.green.outputs.cache-hit != 'true'
        run: echo "${{ steps.tree.outputs.tree }}" > .ci-green

      - name: Persist the green-tree marker
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/staging' && steps.green.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-green
          key: ci-green-${{ steps.tree.outputs.tree }}


  e2e:
    name: e2e (local supabase stack)
    # Expensive: the disposable stack, a production build and the serial
    # Playwright suite. Runs only for `develop` — pull requests that target it
    # and pushes to it — plus manual dispatches. Never on feature branches.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The whole job talks to the throwaway stack started below. These are the
      # CLI's fixed local ports; nothing here resolves to a hosted project.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Explicit opt-in for the local-stack branch of scripts/e2e/guards.ts.
      # It authorises loopback hosts only; a remote DATABASE_URL would still
      # need E2E_ALLOWED_DB_HOST + E2E_CONFIRM_PRODUCTION.
      E2E_ALLOW_LOCAL_STACK: "yes"
      # Not a secret: it is created inside the disposable stack, never sent
      # anywhere, and destroyed with the stack. Secrets are deliberately not
      # used, so forked pull requests can run this job.
      E2E_PASSWORD: e2e-local-password-only
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Pinned: the config file in apps/web/supabase is version-sensitive.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web prisma:generate

      - name: Start local Supabase stack
        working-directory: apps/web
        run: supabase start

      - name: Export local stack credentials
        working-directory: apps/web
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1090
          . "$RUNNER_TEMP/supabase.env"
          set +a
          # Newer CLI builds expose publishable/secret keys alongside the
          # legacy anon/service-role JWTs. Accept either; both are local-only.
          anon="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          service="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$anon" ] || [ -z "$service" ]; then
            echo "::error::supabase status did not expose local anon/service keys"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${anon}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${service}"
          } >> "$GITHUB_ENV"

      # Fail before any DDL if DATABASE_URL is not the disposable stack. The
      # seed and Playwright guards run later, after `prisma migrate deploy`.
      - name: Verify the CI e2e target before migrating
        run: pnpm --filter web exec tsx scripts/e2e/check-ci-target.ts

      - name: Apply migrations to the local database
        run: pnpm --filter web exec prisma migrate deploy

      - name: Seed the e2e fixture
        run: pnpm --filter web exec tsx scripts/e2e/seed-e2e.ts

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # next build directly (not pnpm build) so CI never runs
      # `prisma migrate deploy` twice and never reaches a hosted database.
      - name: Build
        run: pnpm --filter web exec next build

      - name: Start the app
        run: |
          set -euo pipefail
          nohup pnpm --filter web exec next start -p 3000 \
            > "$RUNNER_TEMP/next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "app is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Next.js did not become ready in 120s"
          tail -n 100 "$RUNNER_TEMP/next.log"
          exit 1

      # workers: 1 and retries: 0 come from playwright.config.ts: the suite is
      # stateful against the shared fixture and must stay serial.
      - name: Run Playwright
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the app and the local Supabase stack
        if: always()
        working-directory: apps/web
        run: |
          if [ -f "$RUNNER_TEMP/next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/next.pid")" 2>/dev/null || true
          fi
          pkill -f "next start" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/next.log" ]; then
            tail -n 50 "$RUNNER_TEMP/next.log" || true
          fi
          supabase stop --no-backup || true

