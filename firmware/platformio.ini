[platformio]
src_dir = firmware-main
; There is no unqualified "esp32dev" environment any more. A relay pin is a
; property of the physical unit, so every image names its wiring:
;   esp32dev-gpio5   - CICT Building A field unit (relay GPIO 5)
;   esp32dev-gpio25  - reference / bench board (relay GPIO 25)
; The default is the explicit reference build, never a silent wiring choice.
; Build the field unit with -e esp32dev-gpio5 (docs/runbook.md).
default_envs = esp32dev-gpio25

; Shared ESP32 settings. Deliberately not a buildable variant: the sketch
; refuses to compile without RELAY_PIN and FW_HW_VARIANT (firmware-main.ino).
[env:esp32-base]
; Pinned for reproducibility, matching the validated core on the
; energy-monitoring project. Do not float this to "espressif32" latest.
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17

; Two 1.875 MB app slots instead of the default two 1.25 MB slots, so a full
; signed image always fits. The table also keeps NVS at 0x9000, so
; pio run -t upload keeps the stored WiFi credentials and device identity.
; A partition table can never be changed over the air: this is the one USB
; bootstrap flash (docs/firmware-ota-plan.md §3.1 and §6, decision OTA-1).
board_build.partitions = min_spiffs.csv

; Libraries are resolved by PlatformIO; no Arduino Library Manager step.
lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit BusIO@^1.17.4
    bblanchon/ArduinoJson@^7.4.3
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6

; Reference board: relay signal on GPIO 25. The variant name and the pin are
; one contract: hardware.h maps gpio25 -> 25 and the sketch static_asserts it.
[env:esp32dev-gpio25]
extends = env:esp32-base
build_flags = ${env:esp32-base.build_flags} -DRELAY_PIN=25 -DFW_HW_VARIANT=\"gpio25\"

; CICT Building A field unit: relay signal on GPIO 5 (found on the bench
; 2026-10-28). Build and upload this unit with:
;   pio run -d firmware -e esp32dev-gpio5 -t upload
[env:esp32dev-gpio5]
extends = env:esp32-base
build_flags = ${env:esp32-base.build_flags} -DRELAY_PIN=5 -DFW_HW_VARIANT=\"gpio5\"

; Bench-only build with LAN ArduinoOTA enabled (decision OTA-7). Field builds
; compile the LAN updater out entirely. This alias stays the GPIO 25 reference
; board so existing bench instructions keep their meaning.
;   pio run -d firmware -e esp32dev-lan
[env:esp32dev-lan]
extends = env:esp32dev-gpio25
build_flags = ${env:esp32dev-gpio25.build_flags} -DENABLE_LAN_OTA

; Same bench updater for a GPIO 5 unit.
[env:esp32dev-gpio5-lan]
extends = env:esp32dev-gpio5
build_flags = ${env:esp32dev-gpio5.build_flags} -DENABLE_LAN_OTA

; Host-side unit tests for the pure safety, filter and hardware-variant
; modules (firmware 1.6.0+). No board, no network: build with the local MinGW
; toolchain that PlatformIO already installs for the native platform.
;   pio test -d firmware -e native
[env:native]
platform = native
; ArduinoJson is header-only and works on the host; the 1.7.0 config contract
; (firmware-main/config.h) is parsed with the same library the sketch uses.
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
; -static: the PlatformIO MinGW is a 32-bit build whose runtime DLLs are not on
; PATH, so the test binary must not depend on them.
build_flags = -std=gnu++17 -static -static-libgcc -static-libstdc++
; The .ino needs the ESP32 core, so the sketch is excluded from the host build.
; The test includes firmware-main/*.h directly.
build_src_filter = -<*>
test_build_src = no
test_framework = unity
; Windows: fall back to the MinGW that PlatformIO keeps in its package dir when
; no host gcc is on PATH, and copy its runtime DLLs beside the test binary.
; Both no-ops elsewhere.
extra_scripts =
    pre:scripts/native_toolchain.py
    post:scripts/native_runtime.py
